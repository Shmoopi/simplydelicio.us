{{- $pag := .Paginator }}
{{- if gt $pag.TotalPages 1 }}
<nav class="pager" aria-label="Pagination">
  {{- if $pag.HasPrev }}
  <a class="button button--ghost" href="{{ $pag.Prev.URL }}" rel="prev">← Newer</a>
  {{- else }}<span></span>{{ end }}
  <span class="pager__status">Page {{ $pag.PageNumber }} of {{ $pag.TotalPages }}</span>
  {{- if $pag.HasNext }}
  <a class="button button--ghost" href="{{ $pag.Next.URL }}" rel="next">Older →</a>
  {{- else }}<span></span>{{ end }}
</nav>
{{- end }}
