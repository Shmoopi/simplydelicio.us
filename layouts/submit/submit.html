{{ define "main" }}
<header class="page-head">
  <h1>Submit a recipe</h1>
  <p class="page-head__count">Share a favorite and we’ll format it for the site.</p>
</header>
<iframe name="hidden_iframe" id="hidden_iframe" hidden
  onload="if (window.submitted) { window.location = '/submit/thank-you/'; }"></iframe>
<form class="form"
  action="https://docs.google.com/forms/d/e/1FAIpQLSfszSIlMZFgdP84rCfBQJDHprADkR7Ru5hpuPH3HYU3YLzxgg/formResponse"
  method="POST" target="hidden_iframe" onsubmit="window.submitted = true;">

  <div class="field">
    <label for="name">Recipe name <span class="req" aria-hidden="true">*</span></label>
    <input id="name" name="entry.839491579" type="text" placeholder="Grandma’s apple cake" required>
  </div>

  <div class="field">
    <label for="ingredients">Ingredients <span class="req" aria-hidden="true">*</span></label>
    <textarea id="ingredients" name="entry.342596028" rows="6" placeholder="One ingredient per line" required></textarea>
  </div>

  <div class="field">
    <label for="details">Directions <span class="req" aria-hidden="true">*</span></label>
    <textarea id="details" name="entry.1909528748" rows="6" placeholder="Step-by-step instructions" required></textarea>
  </div>

  <div class="field">
    <label for="notes">Notes</label>
    <textarea id="notes" name="entry.224764909" rows="3" placeholder="Tips, substitutions, serving ideas…"></textarea>
  </div>

  <div class="field">
    <label for="image">Image URL</label>
    <input id="image" name="entry.484758853" type="url" placeholder="https://www.example.com/image.png">
  </div>

  <button class="button" type="submit">Submit recipe</button>
</form>
{{ end }}
